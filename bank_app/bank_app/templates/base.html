<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Mini Bank{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    nav a { margin-right: 1rem; }
    input, button { padding: .5rem; margin: .25rem 0; }
    .flash { padding: .6rem; border-radius: 4px; margin: 1rem 0; }
    .success { background: #d4edda; } .error { background: #f8d7da; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ccc; padding: .4rem; text-align: left; }
  </style>
</head>
<body>
  <h1>Mini Bank</h1>
  {% if session.user_id %}
  <nav><a id="nav-dashboard" href="{{ url_for('dashboard') }}">Dashboard</a>
       <a id="nav-history" href="{{ url_for('history') }}">History</a>
       <a id="nav-logout" href="{{ url_for('logout') }}">Logout</a></nav>
  {% endif %}
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div id="flash" class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</body>
</html>
